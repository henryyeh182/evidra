<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pacevera — Adaptive training decisions</title>
  <desc id="desc">Turn training evidence into an explainable change to today’s planned session.</desc>
  <rect width="1200" height="630" fill="#f0eee6"/>
  <circle cx="1040" cy="-30" r="300" fill="#dcede4"/>
  <circle cx="1120" cy="560" r="190" fill="#e9e3d6"/>
  <g transform="translate(78 74)">
    <rect width="58" height="58" rx="14" fill="#157554"/>
    <path d="M17 39 29 17l12 22h-9l-3-6-3 6h-9Z" fill="#f0eee6"/>
  </g>
  <text x="154" y="116" fill="#1f1e1d" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Pacevera</text>
  <text x="80" y="260" fill="#1f1e1d" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-4">Know what to do</text>
  <text x="80" y="348" fill="#157554" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-4">today.</text>
  <text x="84" y="414" fill="#68645c" font-family="Arial, Helvetica, sans-serif" font-size="25">Adaptive training decisions, with a reason you can inspect.</text>
  <g transform="translate(760 175)">
    <rect width="330" height="260" rx="18" fill="#111b30"/>
    <text x="28" y="42" fill="#9faebe" font-family="monospace" font-size="13" letter-spacing="2">TODAY’S BRIEF</text>
    <text x="28" y="88" fill="#eef4f5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Tempo Run</text>
    <text x="28" y="121" fill="#9faebe" font-family="monospace" font-size="15">50 min · high</text>
    <text x="165" y="94" fill="#49d993" font-family="monospace" font-size="30">→</text>
    <text x="215" y="88" fill="#eef4f5" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Moderate</text>
    <text x="215" y="121" fill="#9faebe" font-family="monospace" font-size="15">50 min · moderate</text>
    <line x1="28" y1="153" x2="302" y2="153" stroke="#34445e"/>
    <text x="28" y="190" fill="#9faebe" font-family="monospace" font-size="13">WHY THIS CHANGED</text>
    <text x="28" y="220" fill="#eef4f5" font-family="Arial, Helvetica, sans-serif" font-size="17">Readiness below threshold.</text>
    <text x="28" y="243" fill="#49d993" font-family="monospace" font-size="12">RULE EVD-R-002 · TRACEABLE</text>
  </g>
  <text x="80" y="560" fill="#157554" font-family="monospace" font-size="14" letter-spacing="1.5">EVIDENCE → STATE → DECISION → ACTION</text>
</svg>
